# ==============================================================================
# LabCore ELIS OS — Main Nginx Configuration
# High-Throughput Production Edge Gateway with ASTM TCP Stream Proxy
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

# ------------------------------------------------------------------------------
# Raw TCP Stream Proxy for ASTM / HL7 Laboratory Analyzers (Port 5005)
# Direct Layer 4 packet streaming without HTTP protocol overhead
# ------------------------------------------------------------------------------
stream {
    upstream astm_analyzer_backend {
        server backend:5005;
    }

    server {
        listen 5005;
        proxy_pass astm_analyzer_backend;
        proxy_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate Limiting Zones (DDoS & Brute Force Defense)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Gzip Compression for High-Speed Clinical Assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype;

    include /etc/nginx/conf.d/*.conf;
}
